    <!-- Inline drag/drop prevention - must be early to catch Chrome's default behavior -->
    <script>
        // Prevent Chrome's default drag navigation immediately - CRITICAL for preventing new tab
        (function () {
            function preventDefaultDrag(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            function preventDefaultDrop(e) {
                // ONLY prevent default, don't stop propagation so our handler can process it
                e.preventDefault();
                e.returnValue = false;
                console.log('Inline drop handler fired - preventing default (allowing propagation)');
                // DON'T call stopPropagation or stopImmediatePropagation here
                // We want our script.js handler to still fire
                return false;
            }

            // CRITICAL: Prevent drop BEFORE Chrome handles it
            // Add immediately to document - use capture phase to run first
            document.addEventListener('dragover', preventDefaultDrag, true);
            document.addEventListener('dragenter', preventDefaultDrag, true);
            document.addEventListener('drop', preventDefaultDrop, true);

            // Also add to window - this is crucial
            window.addEventListener('dragover', preventDefaultDrag, true);
            window.addEventListener('dragenter', preventDefaultDrag, true);
            window.addEventListener('drop', preventDefaultDrop, true);

            // Add to documentElement (html element) too
            if (document.documentElement) {
                document.documentElement.addEventListener('dragover', preventDefaultDrag, true);
                document.documentElement.addEventListener('dragenter', preventDefaultDrag, true);
                document.documentElement.addEventListener('drop', preventDefaultDrop, true);
            }
        })();
    </script>

        // Keep the Enter key handler
        document.getElementById('text-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const textInput = document.getElementById('text-input');
                const message = textInput.value.trim();

                if (message) {
                    console.log("Sending message: " + message);  // Debug line

                    // Display the user message in the output area
                    try {
                        if (typeof eel !== 'undefined' && eel.printToOutput) eel.printToOutput("User: " + message);
                        else console.log("Eel not available: ", message);
                    } catch (err) {
                        console.error('Error calling eel.printToOutput', err);
                    }

                    // Send the message to Jarvis (async)
                    try {
                        if (typeof eel !== 'undefined' && eel.process_text_input) {
                            eel.process_text_input(message);
                        } else {
                            console.warn('Eel.process_text_input not available; local fallback only.');
                        }
                    } catch (err) {
                        console.error('Error calling eel.process_text_input', err);
                    }

                    // Clear the input field
                    textInput.value = '';
                }
            }
        });

        // Get assistant name from Python when page loads
        document.addEventListener('DOMContentLoaded', function () {
            // Expose and call the Python function to get assistant name
            eel.get_assistant_name()(function (name) {
                // Update the display name in the UI
                document.getElementById('assistant-name-display').textContent = name;
                // Update the placeholder text
                document.getElementById('text-input').placeholder = `Message ${name}...`;
            });

            // Initialize settings panel
            initSettingsPanel();
            initResetButton();
        });

        // Reset-conversation button — same effect as saying or typing "clear
        // the conversation" (see main.py's hard-coded commands), reachable
        // with a click. A brief spin on the icon is the only feedback here;
        // the actual "Done. The conversation is cleared, sir." appears (and
        // is spoken) once FreeClaw answers, the same as any other reply.
        function initResetButton() {
            const resetButton = document.getElementById('reset-button');
            if (!resetButton) return;
            resetButton.addEventListener('click', function () {
                resetButton.classList.add('spinning');
                setTimeout(() => resetButton.classList.remove('spinning'), 600);
                if (typeof eel !== 'undefined' && eel.reset_conversation) {
                    eel.reset_conversation();
                }
            });
        }

        // Function to show memory saved indicator (global for eel access)
        function showMemorySavedIndicator() {
            const settingsButton = document.getElementById('settings-button');
            if (settingsButton) {
                settingsButton.classList.add('memory-saved');
                setTimeout(() => {
                    settingsButton.classList.remove('memory-saved');
                }, 2500); // 2.5 seconds
            }
        }
        eel.expose(showMemorySavedIndicator);

        // Settings Panel Functions
        function initSettingsPanel() {
            const settingsButton = document.getElementById('settings-button');
            const settingsPanel = document.getElementById('settings-panel');
            const settingsClose = document.getElementById('settings-close');
            const settingsOverlay = document.getElementById('settings-overlay');
            const dndToggle = document.getElementById('dnd-toggle');
            const assistantNameInput = document.getElementById('assistant-name-input');
            const mainView = document.getElementById('settings-main-view');
            const apiKeysView = document.getElementById('settings-api-keys-view');
            const apiKeyServiceView = document.getElementById('settings-api-key-service-view');
            const memoryView = document.getElementById('settings-memory-view');
            const apiKeysNavBtn = document.getElementById('api-keys-nav-btn');
            const apiKeysBackBtn = document.getElementById('api-keys-back-btn');
            const apiKeyServiceBackBtn = document.getElementById('api-key-service-back-btn');
            const memoryNavBtn = document.getElementById('memory-nav-btn');
            const memoryBackBtn = document.getElementById('memory-back-btn');
            const kasaNavBtn = document.getElementById('kasa-nav-btn');
            const kasaBackBtn = document.getElementById('kasa-back-btn');
            const kasaView = document.getElementById('settings-kasa-view');
            const alarmsNavBtn = document.getElementById('alarms-nav-btn');
            const alarmsBackBtn = document.getElementById('alarms-back-btn');
            const alarmsView = document.getElementById('settings-alarms-view');
            const workspacesNavBtn = document.getElementById('workspaces-nav-btn');
            const workspacesBackBtn = document.getElementById('workspaces-back-btn');
            const workspacesView = document.getElementById('settings-workspaces-view');
            const blackScreenToggle = document.getElementById('black-screen-toggle');
            const blackScreenOverlay = document.getElementById('black-screen-overlay');

            // Black screen toggle functionality
            if (blackScreenToggle && blackScreenOverlay) {
                blackScreenToggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    blackScreenOverlay.classList.toggle('active');
                });

                blackScreenOverlay.addEventListener('click', function () {
                    blackScreenOverlay.classList.remove('active');
                });
            }

            // Load current assistant name
            eel.get_assistant_name()(function (name) {
                if (assistantNameInput) {
                    assistantNameInput.value = name;
                    assistantNameInput.defaultValue = name;
                }
            });

            // Load current DND state
            eel.get_do_not_disturb()(function (dndState) {
                dndToggle.checked = dndState;

            // Load API keys function
            function loadApiKeys() {

                }
                apiKeysList.innerHTML = '<div class="no-memories">Loading API keys...</div>';

                try {
                    eel.get_all_api_keys()(function (apiKeys) {
                        try {
                            if (apiKeys && typeof apiKeys === 'object') {
                                displayApiKeys(apiKeys);
                            } else {
                                console.error('Invalid API keys response:', apiKeys);
                                apiKeysList.innerHTML = '<div class="no-memories">Error: Invalid response from server</div>';
                            }
                        } catch (e) {
                            console.error('Error displaying API keys:', e);
                            apiKeysList.innerHTML = '<div class="no-memories">Error loading API keys: ' + e.message + '</div>';
                        }
                    });
                } catch (e) {
                    console.error('Error calling get_all_api_keys:', e);
                    apiKeysList.innerHTML = '<div class="no-memories">Error: Could not load API keys</div>';
                }
            }

            // Display API keys function (service list view)
            function displayApiKeys(apiKeys) {
                const apiKeysList = document.getElementById('api-keys-list');
                apiKeysList.innerHTML = '';

                const apiKeyNames = Object.keys(apiKeys).sort();

                if (apiKeyNames.length === 0) {
                    apiKeysList.innerHTML = '<div class="no-memories">No API keys configured</div>';
                    return;
                }

                apiKeyNames.forEach(function (keyName) {
                    const serviceData = apiKeys[keyName];
                    // Handle both old format (array) and new format (object with keys and selected_key_id)
                    const keys = Array.isArray(serviceData) ? serviceData : (serviceData.keys || []);

                    // Create service button (navigates to service view)
                    const serviceButton = document.createElement('button');
                    serviceButton.className = 'api-key-service-button';

                    serviceButton.innerHTML = `
                        <span class="api-key-service-name">${keyName.replace(/_/g, ' ')}</span>
                        <span class="api-key-service-count">${keys.length} key${keys.length !== 1 ? 's' : ''}</span>
                        <svg class="api-key-service-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none">
                            <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    `;

                    // Navigate to service view on click
                    serviceButton.addEventListener('click', function () {
                        showApiKeyServiceView(keyName);
                    });

                    apiKeysList.appendChild(serviceButton);
                });
            }

            // Load and display keys for a specific service
            function loadApiKeyService(serviceName) {
                const serviceKeysList = document.getElementById('api-key-service-keys-list');
                const serviceTitle = document.getElementById('api-key-service-title');

                serviceTitle.textContent = serviceName.replace(/_/g, ' ');
                serviceKeysList.innerHTML = '<div class="no-memories">Loading keys...</div>';

                eel.get_all_api_keys()(function (apiKeys) {
                    try {
                        if (apiKeys && typeof apiKeys === 'object' && apiKeys[serviceName]) {
                            const serviceData = apiKeys[serviceName];
                            // Handle both old format (array) and new format (object with keys and selected_key_id)
                            const keys = Array.isArray(serviceData) ? serviceData : (serviceData.keys || []);
                            const selectedKeyId = Array.isArray(serviceData) ? null : (serviceData.selected_key_id || null);
                            const preferredKeyId = Array.isArray(serviceData) ? null : (serviceData.preferred_key_id || null);
                            displayApiKeyService(serviceName, keys, selectedKeyId, preferredKeyId);
                        } else {
                            serviceKeysList.innerHTML = '<div class="no-memories">No keys found for this service</div>';
                        }
                    } catch (e) {
                        console.error('Error displaying service keys:', e);
                        serviceKeysList.innerHTML = '<div class="no-memories">Error loading keys: ' + e.message + '</div>';
                    }
                });
            }

            // Display keys for a specific service
            function displayApiKeyService(serviceName, keys, selectedKeyId, preferredKeyId) {
                const serviceKeysList = document.getElementById('api-key-service-keys-list');
                serviceKeysList.innerHTML = '';

                if (!keys || keys.length === 0) {
                    serviceKeysList.innerHTML = '<div class="no-memories">No keys configured for this service</div>';
                }

                // Add existing keys
                keys.forEach(function (keyEntry) {
                    const isSelected = selectedKeyId === keyEntry.id;
                    const keyItem = createApiKeyItem(serviceName, keyEntry, isSelected, false);
                    serviceKeysList.appendChild(keyItem);
                });

                // Add "Add New Key" section
                const addKeyContainer = document.createElement('div');
                addKeyContainer.className = 'api-key-add-container';

                const addKeyInput = document.createElement('input');
                addKeyInput.type = 'text';
                addKeyInput.className = 'settings-input';
                addKeyInput.placeholder = 'Enter new API key...';
                addKeyInput.style.marginRight = '8px';

                const addKeyNameInput = document.createElement('input');
                addKeyNameInput.type = 'text';

                addKeyButton.textContent = 'Add Key';
                addKeyButton.addEventListener('click', function () {

                        alert('Please enter an API key');
                        return;

                        addKeyButton.click();
                    }

                addKeyContainer.appendChild(addKeyInput);
                addKeyContainer.appendChild(addKeyNameInput);
                addKeyContainer.appendChild(addKeyButton);

            // Create individual API key item
            function createApiKeyItem(keyName, keyEntry, isSelected, isPreferred) {
                const keyItem = document.createElement('div');
                keyItem.className = 'api-key-item';
                if (isSelected) {
                    keyItem.classList.add('api-key-item-selected');
                }
                keyItem.dataset.keyId = keyEntry.id;

                const keyHeader = document.createElement('div');
                keyHeader.className = 'api-key-item-header';

                const keyInfo = document.createElement('div');
                keyInfo.className = 'api-key-info';

                const keyNameDisplay = document.createElement('div');
                keyNameDisplay.className = 'api-key-name-display';

                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'api-key-name-input';
                nameInput.value = keyEntry.name || 'Unnamed';
                nameInput.dataset.keyId = keyEntry.id;

                nameInput.addEventListener('blur', function () {
                    const newName = nameInput.value.trim();
                    if (newName && newName !== keyEntry.name) {
                        eel.rename_api_key(keyName, keyEntry.id, newName)(function (result) {
                            if (!result.success) {
                                nameInput.value = keyEntry.name;
                                alert('Error renaming: ' + result.message);
                            } else {
                                // Reload the service view to show updated name
                                loadApiKeyService(keyName);
                            }
                        });
                    }
                });

                // Also save on Enter key
                nameInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault(); // Prevent any default behavior
                        nameInput.blur(); // Trigger blur which will save the name
                    }
                });

                keyNameDisplay.appendChild(nameInput);

                const quotaDisplay = document.createElement('div');
                quotaDisplay.className = 'api-key-quota';
                let quotaStatus = keyEntry.quota_remaining || 'Unknown';
                const quotaErrors = keyEntry.quota_errors || 0;

                const quotaLabel = document.createElement('span');
                quotaLabel.className = 'quota-label';
                quotaLabel.textContent = 'Quota: ';

                const quotaValue = document.createElement('span');
                quotaValue.className = 'quota-value';
                if (quotaStatus === 'Exhausted' || quotaStatus.includes('Exhausted')) {
                    quotaValue.classList.add('quota-exhausted');
                    // For Groq keys, show quota usage if available
                    if (keyName === 'groq_api_key' && keyEntry.quota_usage) {
                        quotaValue.textContent = `Exhausted (${keyEntry.quota_usage})`;
                    } else {
                        quotaValue.textContent = quotaStatus;
                    }
                } else {
                    quotaValue.textContent = quotaStatus;
                }
                quotaValue.style.cursor = 'pointer';
                quotaValue.title = 'Click to check availability';

                // Make quota value clickable to check availability
                quotaValue.addEventListener('click', function (e) {
                    e.stopPropagation(); // Prevent triggering the menu collapse
                    const originalText = quotaValue.textContent;
                    quotaValue.textContent = 'Checking...';
                    quotaValue.style.opacity = '0.7';
                    quotaValue.style.pointerEvents = 'none';

                    eel.check_api_key_availability(keyName, keyEntry.id)(function (result) {
                        quotaValue.style.pointerEvents = 'auto';
                        quotaValue.style.opacity = '1';

                        if (result.success) {
                            // Update styling based on result
                            quotaValue.classList.remove('quota-exhausted', 'quota-available', 'quota-invalid');
                            if (result.quota_remaining === 'Exhausted' || result.quota_remaining.includes('Exhausted')) {
                                quotaValue.classList.add('quota-exhausted');
                                // For Groq keys, show quota usage if available
                                if (keyName === 'groq_api_key' && result.quota_usage) {
                                    quotaValue.textContent = `Exhausted (${result.quota_usage})`;
                                } else if (keyName === 'groq_api_key' && keyEntry.quota_usage) {
                                    quotaValue.textContent = `Exhausted (${keyEntry.quota_usage})`;
                                } else {
                                    quotaValue.textContent = result.quota_remaining;
                                }
                            } else if (result.quota_remaining === 'Available' || result.quota_remaining.includes('Available')) {
                                quotaValue.classList.add('quota-available');
                                quotaValue.textContent = result.quota_remaining;
                            } else if (result.quota_remaining === 'Invalid Key' || result.quota_remaining.includes('Invalid')) {
                                quotaValue.classList.add('quota-invalid');
                                quotaValue.textContent = result.quota_remaining;
                            } else {
                                quotaValue.textContent = result.quota_remaining;
                            }

                            // Update errors display
                            if (errorsSpan) {
                                if (result.quota_errors > 0) {
                                    errorsSpan.textContent = `(${result.quota_errors} errors)`;
                                } else {
                                    errorsSpan.textContent = '';
                                }
                            }

                            // Update the key entry in the current view without reloading
                            keyEntry.quota_remaining = result.quota_remaining;
                            keyEntry.quota_errors = result.quota_errors;
                            keyEntry.status = result.status;
                            // Update quota_usage if provided
                            if (result.quota_usage) {
                                keyEntry.quota_usage = result.quota_usage;
                            }
                        } else {
                            quotaValue.textContent = originalText;
                            alert('Error checking API key: ' + result.message);
                        }
                    });
                });

                const errorsSpan = document.createElement('span');
                errorsSpan.className = 'quota-errors';
                if (quotaErrors > 0) {
                    errorsSpan.textContent = `(${quotaErrors} errors)`;
                }

                quotaDisplay.appendChild(quotaLabel);
                quotaDisplay.appendChild(quotaValue);
                quotaDisplay.appendChild(errorsSpan);

                keyInfo.appendChild(keyNameDisplay);
                keyInfo.appendChild(quotaDisplay);

                const keyActions = document.createElement('div');
                keyActions.className = 'api-key-actions';

                const deleteButton = document.createElement('button');
                deleteButton.className = 'api-key-delete-button';
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', function () {
                    if (confirm(`Are you sure you want to delete "${keyEntry.name}"?`)) {
                        eel.delete_api_key(keyName, keyEntry.id)(function (result) {
                            if (result.success) {
                                // Reload the current view
                                if (apiKeyServiceView.classList.contains('active')) {
                                    loadApiKeyService(keyName);
                                } else {
                                    loadApiKeys();
                                }
                            } else {
                                alert('Error deleting key: ' + result.message);
                            }
                        });
                    }
                });

                keyActions.appendChild(deleteButton);

                keyHeader.appendChild(keyInfo);
                keyHeader.appendChild(keyActions);

                const keyValue = document.createElement('div');
                keyValue.className = 'api-key-value';
                const maskedKey = keyEntry.key || '';
                keyValue.textContent = maskedKey;

                keyItem.appendChild(keyHeader);
                keyItem.appendChild(keyValue);

                return keyItem;
            }

            // Display Kasa devices function
            function displayKasaDevices(devices) {
                const kasaDevicesList = document.getElementById('kasa-devices-list');
                kasaDevicesList.innerHTML = '';

                if (!devices || devices.length === 0) {
                    kasaDevicesList.innerHTML = '<div class="no-memories">No devices configured. Click "Discover Devices" to find Kasa devices on your network.</div>';
                }

                // Add existing devices
                devices.forEach(function (device) {
                    const deviceItem = createKasaDeviceItem(device);
                    kasaDevicesList.appendChild(deviceItem);
                });

                // Add "Discover Devices" button

                discoverContainer.className = 'api-key-add-container';
                discoverContainer.style.marginTop = '20px';

                const discoverButton = document.createElement('button');
                discoverButton.className = 'api-key-add-button';
                discoverButton.textContent = 'Discover Devices';
                discoverButton.style.width = '100%';
                discoverButton.style.marginBottom = '10px';
                discoverButton.addEventListener('click', function () {
                    discoverButton.disabled = true;
                    discoverButton.textContent = 'Discovering... (this may take 30-60 seconds)';

                    eel.discover_kasa_devices()(function (discoveredDevices) {
                        discoverButton.disabled = false;
                        discoverButton.textContent = 'Discover Devices';

                        if (discoveredDevices && Array.isArray(discoveredDevices) && discoveredDevices.length > 0) {
                            displayDiscoveredDevices(discoveredDevices);
                        } else {
                            // Show manual entry option
                            const manualEntry = confirm('No devices found automatically.\n\nThe system tried:\n- UDP broadcast discovery\n- Network IP scanning\n\nThis could be due to:\n- Firewall blocking network discovery\n- Devices on a different subnet\n- Devices powered off\n\nWould you like to manually add a device by IP or MAC address?');

                        }
                    });
                });

                discoverContainer.appendChild(discoverButton);

                kasaDevicesList.appendChild(discoverContainer);

            // Show manual device entry dialog
            function showManualDeviceEntry() {
                const entryMethod = confirm('How would you like to add the device?\n\nOK = By MAC Address (Recommended - more reliable)\nCancel = By IP Address');

                let ip = null;
                let mac = null;

                if (entryMethod) {
                    // MAC address entry
                    const macInput = prompt('Enter the MAC address of your Kasa device:\n\nFormat: XX:XX:XX:XX:XX:XX or XXXXXXXXXXXX\n\n(You can find this in your router settings, Kasa app, or on the device label)');
                    if (!macInput) return;

                    // Normalize MAC address
                    let macNormalized = macInput.toUpperCase().replace(/[:\-]/g, '');
                    if (macNormalized.length === 12) {
                        mac = macNormalized.match(/.{2}/g).join(':');
                    } else if (macNormalized.length === 17 && macInput.includes(':')) {
                        mac = macInput.toUpperCase();
                    } else {
                        alert('Invalid MAC address format. Please use XX:XX:XX:XX:XX:XX format.');
                        return;
                    }
                } else {
                    // IP address entry
                    ip = prompt('Enter the IP address of your Kasa device:\n\n(You can find this in your router settings or Kasa app)');
                    if (!ip) return;

                    // Basic IP validation
                    const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
                    if (!ipRegex.test(ip)) {
                        alert('Invalid IP address format. Please enter a valid IP (e.g., 192.168.1.100)');
                        return;
                    }
                }

                const name = prompt('Enter a name for this device:', 'My Kasa Device');
                if (!name) return;

                const deviceType = confirm('Is this a smart bulb? (Click OK for bulb, Cancel for plug)') ? 'bulb' : 'plug';

                // Test the connection first
                eel.test_kasa_device_connection(ip || null, mac || null)(function (testResult) {
                    if (testResult.success) {
                        // Device is reachable, save it with both IP and MAC if available
                        const saveIp = testResult.ip || ip;
                        const saveMac = testResult.mac || mac;

                        eel.save_kasa_device(name, saveIp, saveMac, deviceType)(function (saveResult) {
                            if (saveResult.success) {
                                const macInfo = saveMac ? `\nMAC: ${saveMac}` : '';
                                alert(`Device "${name}" added successfully!\n\nDevice Name: ${testResult.name}\nType: ${testResult.type}\nIP: ${saveIp}${macInfo}\nStatus: ${testResult.is_on ? 'ON' : 'OFF'}`);
                                loadKasaDevices();
                            } else {
                                alert('Error saving device: ' + (saveResult.message || 'Unknown error'));
                            }
                        });
                    } else {
                        // Still try to save it - user might want to add it anyway
                        const stillAdd = confirm(`Could not connect to device.\n\nError: ${testResult.message}\n\nPossible reasons:\n- Device is powered off\n- Device is on a different network\n- Firewall blocking connection\n- Incorrect IP/MAC address\n\nWould you still like to add it? (You can test it later using the control buttons)`);
                        if (stillAdd) {
                            eel.save_kasa_device(name, ip, mac, deviceType)(function (saveResult) {
                                if (saveResult.success) {
                                    alert(`Device "${name}" added. You can test the connection using the control buttons.`);
                                    loadKasaDevices();
                                } else {
                                    alert('Error saving device: ' + (saveResult.message || 'Unknown error'));
                                }
                            });
                        }
                    }
                });
            }

                const modal = document.createElement('div');
                modal.style.background = 'linear-gradient(135deg, rgba(10, 17, 35, 0.98) 0%, rgba(8, 20, 45, 0.96) 100%)';
                modal.style.border = '1px solid rgba(0, 149, 255, 0.5)';

            // Store all memories for filtering
            let allMemories = [];

            // Load memories function
            function loadMemories() {
                const memoriesList = document.getElementById('memories-list');
                memoriesList.innerHTML = '<div class="no-memories">Loading memories...</div>';

                eel.get_long_term_memories()(function (memoriesJson) {
                    try {
                        const memories = JSON.parse(memoriesJson);
                        allMemories = memories; // Store all memories

                        // Check if there's a search query and filter accordingly
                        const searchInput = document.getElementById('memory-search-input');
                        if (searchInput && searchInput.value) {
                            const filteredMemories = filterMemories(searchInput.value);
                            displayMemories(filteredMemories);
                        } else {
                            displayMemories(memories);
                        }
                    } catch (e) {
                        console.error('Error parsing memories:', e);
                        memoriesList.innerHTML = '<div class="no-memories">Error loading memories</div>';
                    }
                });
            }

            // Filter memories based on search query
            function filterMemories(query) {
                if (!query || query.trim() === '') {
                    return allMemories;
                }

                const searchTerm = query.toLowerCase().trim();
                return allMemories.filter(function (memory) {
                    // Search in memory content
                    const contentMatch = (memory.memory_content || '').toLowerCase().includes(searchTerm);

                    // Search in memory type
                    const typeMatch = (memory.memory_type || '').toLowerCase().includes(searchTerm);

                    // Search in tags
                    const tagsMatch = memory.tags && memory.tags.some(function (tag) {
                        return tag.toLowerCase().includes(searchTerm);
                    });

                    return contentMatch || typeMatch || tagsMatch;
                });
            }

            // Display memories function
            function displayMemories(memories) {
                const memoriesList = document.getElementById('memories-list');

                if (!memories || memories.length === 0) {
                    memoriesList.innerHTML = '<div class="no-memories">No memories found</div>';
                    return;
                }

                memoriesList.innerHTML = '';

                memories.forEach(function (memory) {
                    const memoryItem = document.createElement('div');
                    memoryItem.className = 'memory-item';
                    memoryItem.setAttribute('data-memory-id', memory.id);

                    const header = document.createElement('div');

                    deleteBtn.className = 'memory-delete-btn';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.addEventListener('click', function () {
                        if (confirm('Are you sure you want to delete this memory?')) {
                            deleteMemory(memory.id);

                    });

                    header.appendChild(content);
                    header.appendChild(deleteBtn);

                    const meta = document.createElement('div');
                    meta.className = 'memory-meta';

                    const type = document.createElement('span');
                    type.className = 'memory-type';
                    type.textContent = memory.memory_type || 'other';

                    meta.appendChild(type);

                    if (memory.tags && memory.tags.length > 0) {

                            tags.appendChild(tagSpan);
                        });
                        meta.appendChild(tags);

                    if (memory.importance !== undefined) {

            // Delete memory function
            function deleteMemory(memoryId) {
                eel.delete_long_term_memory(memoryId)(function (resultJson) {
                    try {
                        const result = JSON.parse(resultJson);
                        if (result.success) {
                            // Remove from allMemories array immediately
                            allMemories = allMemories.filter(function (m) {
                                return m.id !== memoryId;
                            });

                            // Immediately remove from UI for instant feedback
                            const memoryItem = document.querySelector(`[data-memory-id="${memoryId}"]`);
                            if (memoryItem) {
                                memoryItem.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                                memoryItem.style.opacity = '0';

                                setTimeout(function () {

                                    loadMemories();
                                }, 300);
                            } else {
                                // Fallback: reload if element not found
                                loadMemories();
                            }
                        } else {

            function loadAlarms() {

                if (!alarmsList) {

                }
                alarmsList.innerHTML = '<div class="no-memories">Loading alarms...</div>';

                try {
                    eel.get_alarms()(function (alarmsJson) {

                            const alarms = JSON.parse(alarmsJson);

            // Display alarms function
            function displayAlarms(alarms) {
                const alarmsList = document.getElementById('alarms-list');
                alarmsList.innerHTML = '';

                if (!alarms || alarms.length === 0) {
                    alarmsList.innerHTML = '<div class="no-memories">No alarms or reminders set. Set alarms by saying "Set an alarm for 9 AM" or reminders by saying "Remind me to take medication at 2 PM".</div>';
                    return;
                }

                alarms.forEach(function (alarm) {
                    const alarmItem = document.createElement('div');
                    alarmItem.className = 'api-key-item';
                    alarmItem.dataset.alarmId = alarm.id;

                    const alarmHeader = document.createElement('div');
                    alarmHeader.className = 'api-key-item-header';

                    const alarmInfo = document.createElement('div');
                    alarmInfo.className = 'api-key-info';

                    const alarmNameDisplay = document.createElement('div');
                    alarmNameDisplay.className = 'api-key-name-display';

                    // Show type indicator and label
                    const itemType = alarm.type || 'alarm';
                    const typeLabel = itemType === 'reminder' ? 'Reminder' : 'Alarm';
                    const displayLabel = alarm.label || (itemType === 'reminder' ? 'Reminder' : 'Alarm');
                    alarmNameDisplay.innerHTML = `<span style="color: rgba(255, 255, 255, 0.6); font-size: 0.8em; margin-right: 8px;">[${typeLabel}]</span>${displayLabel}`;
                    alarmNameDisplay.style.color = '#fff';
                    alarmNameDisplay.style.fontWeight = '600';
                    alarmNameDisplay.style.marginBottom = '5px';

                    const alarmTimeDisplay = document.createElement('div');
                    alarmTimeDisplay.className = 'api-key-quota';

                    // Format time for display
                    const timeStr = alarm.time || '';
                    let displayTime = timeStr;
                    try {
                        // Convert 24-hour to 12-hour format for display
                        const [hours, minutes] = timeStr.split(':');
                        const hour = parseInt(hours);
                        const minute = parseInt(minutes);
                        if (!isNaN(hour) && !isNaN(minute)) {
                            const period = hour >= 12 ? 'PM' : 'AM';
                            const displayHour = hour === 0 ? 12 : (hour > 12 ? hour - 12 : hour);
                            displayTime = `${displayHour}:${minutes.toString().padStart(2, '0')} ${period}`;
                        }
                    } catch (e) {
                        // Keep original format if parsing fails
                    }

                    // Build time info with recurring information
                    const targetDate = alarm.target_date;
                    const daysOfWeek = alarm.days_of_week;
                    const repeatDaily = alarm.repeat_daily;

                    // Format date if provided
                    let dateDisplay = '';
                    if (targetDate !== null && targetDate !== undefined && targetDate !== '') {
                        try {
                            // Handle ISO date format (YYYY-MM-DD) - JavaScript Date needs to parse this correctly
                            let dateObj;
                            if (typeof targetDate === 'string' && targetDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
                                // ISO date format (YYYY-MM-DD) - add time to make it parseable
                                dateObj = new Date(targetDate + 'T00:00:00');
                            } else {
                                dateObj = new Date(targetDate);
                            }

                            if (!isNaN(dateObj.getTime())) {
                                const dateStr = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                                dateDisplay = ` • ${dateStr}`;
                            }
                        } catch (e) {
                            // If parsing fails, skip date display
                        }
                    }

                    let timeInfo = `Time: ${displayTime}${dateDisplay}`;

                    // Build specification details
                    const specs = [];

                    // Show specific recurring days if provided
                    // Check if daysOfWeek exists, is an array, and has items
                    if (daysOfWeek !== null && daysOfWeek !== undefined && Array.isArray(daysOfWeek) && daysOfWeek.length > 0) {
                        // Format day names nicely (e.g., "Mon, Wed, Fri" instead of "Monday, Wednesday, Friday")
                        const dayAbbrevs = {
                            'Monday': 'Mon', 'Tuesday': 'Tue', 'Wednesday': 'Wed',
                            'Thursday': 'Thu', 'Friday': 'Fri', 'Saturday': 'Sat', 'Sunday': 'Sun'
                        };
                        const formattedDays = daysOfWeek
                            .filter(day => day && day.trim && day.trim()) // Filter out null/empty values
                            .map(day => dayAbbrevs[day] || day)
                            .join(', ');
                        if (formattedDays) {
                            specs.push(`Recurring: ${formattedDays}`);
                        }
                    }
                    // Show daily recurring (only if no specific days are set and repeat_daily is true)
                    else if (repeatDaily === true && (daysOfWeek === null || daysOfWeek === undefined || !Array.isArray(daysOfWeek) || daysOfWeek.length === 0)) {
                        specs.push('Recurring: Daily');
                    }

                    // Display specifications
                    if (specs.length > 0) {
                        // Show all specifications in a styled format
                        const specsText = specs.join(' • ');
                        timeInfo += ` <span style="color: rgba(100, 200, 255, 0.9); font-weight: 600;">[${specsText}]</span>`;
                    } else {
                        // Only show "One-time" if there are no special specifications
                        timeInfo += ` <span style="color: rgba(255, 255, 255, 0.4); font-size: 0.85em;">(One-time)</span>`;
                    }

                    alarmTimeDisplay.innerHTML = timeInfo;
                    alarmTimeDisplay.style.color = 'rgba(255, 255, 255, 0.7)';
                    alarmTimeDisplay.style.fontSize = '0.9em';

                    alarmInfo.appendChild(alarmNameDisplay);
                    alarmInfo.appendChild(alarmTimeDisplay);

                    const alarmActions = document.createElement('div');
                    alarmActions.className = 'api-key-actions';

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'api-key-delete-button';
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', function () {
                        const itemType = alarm.type || 'alarm';
                        const typeName = itemType === 'reminder' ? 'reminder' : 'alarm';
                        const itemLabel = alarm.label || (itemType === 'reminder' ? 'Reminder' : 'Alarm');
                        if (confirm(`Are you sure you want to delete the ${typeName} "${itemLabel}"?`)) {
                            eel.delete_alarm(alarm.id)(function (result) {
                                if (result.success) {
                                    // Immediately remove from UI
                                    const alarmItem = document.querySelector(`[data-alarm-id="${alarm.id}"]`);
                                    if (alarmItem) {
                                        alarmItem.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                                        alarmItem.style.opacity = '0';
                                        alarmItem.style.transform = 'translateX(-20px)';
                                        setTimeout(function () {

                                            // Reload alarms to ensure sync

                                        }, 300);
                                    } else {

                                    }
                                } else {

                                }
                            });
                        }
                    });

                    alarmActions.appendChild(deleteButton);

                    alarmHeader.appendChild(alarmInfo);
                    alarmHeader.appendChild(alarmActions);

                    alarmItem.appendChild(alarmHeader);
                    alarmsList.appendChild(alarmItem);
                });
            }

                        }
                    }
                    workspaceMetaDisplay.textContent = metaText;
                    workspaceMetaDisplay.style.color = 'rgba(255, 255, 255, 0.7)';
                    workspaceMetaDisplay.style.fontSize = '0.9em';

                    workspaceInfo.appendChild(workspaceNameDisplay);
                    workspaceInfo.appendChild(workspaceMetaDisplay);

                    const workspaceActions = document.createElement('div');
                    workspaceActions.className = 'api-key-actions';
                    workspaceActions.style.display = 'flex';
                    workspaceActions.style.gap = '8px';

                    const loadButton = document.createElement('button');
                    loadButton.className = 'api-key-add-button';
                    loadButton.textContent = 'Load';
                    loadButton.style.padding = '6px 12px';
                    loadButton.style.fontSize = '0.9em';
                    loadButton.addEventListener('click', function () {
                        if (confirm(`Load workspace "${workspace.name}"? This will replace your current workspace.`)) {
                            loadButton.disabled = true;
                            loadButton.textContent = 'Loading...';
                            eel.restore_workspace(workspace.id)(function (result) {
                                loadButton.disabled = false;
                                loadButton.textContent = 'Load';
                                if (result.success) {
                                    alert(`Workspace "${workspace.name}" loaded successfully!`);
                                    closeSettings(); // Close settings after loading
                                } else {
                                    alert('Error loading workspace: ' + (result.message || 'Unknown error'));
                                }
                            });
                        }
                    });

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'api-key-delete-button';
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', function () {
                        if (confirm(`Are you sure you want to delete workspace "${workspace.name}"?`)) {
                            eel.delete_workspace(workspace.id)(function (result) {
                                if (result.success) {
                                    // Immediately remove from UI
                                    const workspaceItem = document.querySelector(`[data-workspace-id="${workspace.id}"]`);
                                    if (workspaceItem) {
                                        workspaceItem.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                                        workspaceItem.style.opacity = '0';
                                        workspaceItem.style.transform = 'translateX(-20px)';
                                        setTimeout(function () {
                                            workspaceItem.remove();
                                            loadWorkspaces(); // Reload to ensure sync
                                        }, 300);
                                    } else {
                                        loadWorkspaces();
                                    }
                                } else {
                                    alert('Error deleting workspace: ' + (result.message || 'Unknown error'));
                                }
                            });
                        }
                    });

                    workspaceActions.appendChild(loadButton);
                    workspaceActions.appendChild(deleteButton);

                    workspaceHeader.appendChild(workspaceInfo);
                    workspaceHeader.appendChild(workspaceActions);

                    workspaceItem.appendChild(workspaceHeader);
                    workspacesList.appendChild(workspaceItem);
                });
            }
        }
    </script>
</body>

</html>
